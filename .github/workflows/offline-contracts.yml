name: Offline contracts
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==9.1.1
      - run: |
          PYTHONPATH=src python -m pytest -q tests/test_metrics.py tests/test_degenerate_outputs.py
